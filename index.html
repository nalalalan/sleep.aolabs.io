<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sleep moved to blood</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Sleep metrics now appear inside Blood.">
  <link rel="canonical" href="https://blood.aolabs.io/">
  <meta http-equiv="refresh" content="0; url=https://blood.aolabs.io/">
  <meta name="theme-color" content="#f7f4ee">
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f4ee;
      --ink: #221e1d;
      --muted: #756967;
      --line: rgba(73, 55, 51, .16);
      --blood: #9f3041;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(480px, 100%);
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffdf8;
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      font-size: 28px;
      line-height: 1.05;
    }

    p {
      margin-top: 10px;
      color: var(--muted);
      font-weight: 650;
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      margin-top: 16px;
      padding: 9px 13px;
      border-radius: 8px;
      background: var(--blood);
      color: #fffaf2;
      font-weight: 760;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Sleep moved to Blood</h1>
    <p>Sleep hours now show with glucose, HR, HRV, steps, and the anxiety estimate.</p>
    <a href="https://blood.aolabs.io/">Open Blood</a>
  </main>
</body>
</html>
